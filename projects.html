<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects | PropertyNext</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <meta name="title" content="All Projects | PropertyNext">
    <meta name="description"
        content="Explore our complete portfolio of premium flats, commercial spaces, and joint construction projects in Dhaka.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandLime: '#c8f31d',
                        darkGreen: '#051c14',
                        themeGreen: '#0a8a43'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-[#f8f9fa] font-sans antialiased text-gray-900 selection:bg-brandLime selection:text-black">

    <nav class="w-full px-6 py-5 bg-darkGreen flex justify-between items-center z-50 sticky top-0">
        <div class="max-w-[80rem] mx-auto w-full flex justify-between items-center">
            <a href="index.html" class="text-xl md:text-2xl font-bold tracking-tight text-white">PropertyNext</a>
            <a href="index.html"
                class="bg-white/10 hover:bg-white/20 text-white border border-white/20 rounded-full px-5 py-2 text-sm font-semibold transition-all flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </nav>

    <header class="bg-darkGreen pt-12 pb-24 border-t border-white/10">
        <div class="max-w-[80rem] mx-auto px-6 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Discover Our Projects</h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto">
                Explore our portfolio of meticulously designed residential and commercial spaces. Find the perfect
                property that suits your lifestyle and business needs.
            </p>
        </div>
    </header>

    <!-- Projects Section -->
    <main class="max-w-[80rem] mx-auto px-6 -mt-12 relative z-10 pb-20 flex-grow">

        <!-- Filter Tabs (Now Fully Functional) -->
        <div class="flex flex-wrap justify-center gap-3 mb-10" id="filter-buttons">
            <button onclick="filterProjects('all', this)"
                class="filter-btn px-6 py-2 rounded-full bg-brandLime text-darkGreen font-bold text-sm shadow-md transition-colors">All
                Projects</button>
            <button onclick="filterProjects('upcoming', this)"
                class="filter-btn px-6 py-2 rounded-full bg-white text-gray-600 font-bold text-sm shadow-sm hover:bg-gray-50 border border-gray-200 transition-colors">Upcoming</button>
            <button onclick="filterProjects('ongoing', this)"
                class="filter-btn px-6 py-2 rounded-full bg-white text-gray-600 font-bold text-sm shadow-sm hover:bg-gray-50 border border-gray-200 transition-colors">Ongoing</button>
            <button onclick="filterProjects('completed', this)"
                class="filter-btn px-6 py-2 rounded-full bg-white text-gray-600 font-bold text-sm shadow-sm hover:bg-gray-50 border border-gray-200 transition-colors">Completed</button>
        </div>

        <!-- Projects Grid Container -->
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Loading State -->
            <div class="col-span-full text-center py-20">
                <i class="fas fa-spinner fa-spin text-4xl text-themeGreen mb-4"></i>
                <p class="text-gray-500 font-medium">Fetching projects from server...</p>
            </div>
        </div>

    </main>

    <footer class="bg-darkGreen text-gray-400 py-6 text-center text-sm border-t border-gray-800 mt-auto">
        <p>&copy; 2026 PropertyNext Ltd. All rights reserved.</p>
    </footer>

    <!-- Script to Fetch, Render and Filter Projects -->
    <script>
        // গ্লোবাল ভেরিয়েবল যেখানে সব প্রজেক্ট সেভ থাকবে
        let allProjectsData = [];

        // ১. সার্ভার থেকে প্রজেক্ট নিয়ে আসা
        async function fetchAllProjects() {
            try {
                const response = await fetch('https://propertynextv2-backend.onrender.com/api/projects/all');
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    allProjectsData = result.data; // ডাটা গ্লোবাল ভেরিয়েবলে সেভ করে রাখলাম
                    renderProjects(allProjectsData); // প্রথমে সব প্রজেক্ট দেখাবে
                } else {
                    document.getElementById('projects-grid').innerHTML = `
                        <div class="col-span-full text-center py-20 bg-white rounded-2xl border border-gray-100 shadow-sm">
                            <i class="fas fa-folder-open text-4xl text-gray-300 mb-4"></i>
                            <p class="text-gray-500 font-medium">No projects available at the moment.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Error fetching projects:", error);
                document.getElementById('projects-grid').innerHTML = `
                    <div class="col-span-full text-center py-20 bg-white rounded-2xl border border-red-100 shadow-sm">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                        <p class="text-red-500 font-medium">Failed to load projects. Please try again later.</p>
                    </div>
                `;
            }
        }

        // ২. প্রজেক্টগুলো স্ক্রিনে রেন্ডার করার ফাংশন
        function renderProjects(projectsArray) {
            const gridContainer = document.getElementById('projects-grid');
            gridContainer.innerHTML = ''; // আগের ডেটা মুছে ফেললাম

            if (projectsArray.length === 0) {
                gridContainer.innerHTML = `
                    <div class="col-span-full text-center py-20 bg-white rounded-2xl border border-gray-100 shadow-sm">
                        <i class="fas fa-search text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 font-medium">No projects found in this category.</p>
                    </div>
                `;
                return;
            }

            projectsArray.forEach(project => {
                let statusColor = 'bg-blue-100 text-blue-700';
                if (project.status.toLowerCase() === 'upcoming') statusColor = 'bg-orange-100 text-orange-700';
                if (project.status.toLowerCase() === 'completed') statusColor = 'bg-green-100 text-green-700';

                const cardHTML = `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-xl transition-all duration-300 group flex flex-col h-full fade-in">
                        <div class="relative h-64 overflow-hidden bg-gray-100">
                            <img src="${project.mainImage}" alt="${project.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute top-4 right-4 ${statusColor} px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-sm">
                                ${project.status}
                            </div>
                        </div>
                        
                        <div class="p-6 flex flex-col flex-grow">
                            <h3 class="text-xl font-bold text-gray-900 mb-2 group-hover:text-themeGreen transition-colors line-clamp-1">${project.title}</h3>
                            <p class="text-gray-500 text-sm mb-5 flex items-center gap-2">
                                <i class="fas fa-map-marker-alt text-themeGreen"></i> ${project.location}
                            </p>
                            
                            <div class="grid grid-cols-2 gap-4 mb-6 text-sm border-t border-b border-gray-50 py-4 mt-auto">
                                <div>
                                    <span class="block text-gray-400 text-[11px] uppercase tracking-wider font-bold mb-1">Land Area</span>
                                    <span class="font-bold text-gray-700">${project.landArea || 'N/A'}</span>
                                </div>
                                <div>
                                    <span class="block text-gray-400 text-[11px] uppercase tracking-wider font-bold mb-1">Total Units</span>
                                    <span class="font-bold text-gray-700">${project.totalUnits || 'N/A'}</span>
                                </div>
                            </div>
                            
                            <a href="project-details.html?id=${project._id}" class="block w-full text-center bg-[#f4fbf6] border border-[#d1ebd9] hover:bg-themeGreen hover:text-white text-themeGreen font-bold py-3 rounded-xl transition-colors">
                                View Details <i class="fas fa-arrow-right ml-1 text-sm"></i>
                            </a>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // ৩. বাটনে ক্লিক করলে ফিল্টার করার ফাংশন
        function filterProjects(status, buttonElement) {
            // বাটনগুলোর অ্যাকটিভ কালার পরিবর্তন করা
            const allButtons = document.querySelectorAll('.filter-btn');
            allButtons.forEach(btn => {
                btn.classList.remove('bg-brandLime', 'text-darkGreen');
                btn.classList.add('bg-white', 'text-gray-600');
            });

            // যেটাতে ক্লিক করা হয়েছে, সেটিকে হাইলাইট করা
            buttonElement.classList.remove('bg-white', 'text-gray-600');
            buttonElement.classList.add('bg-brandLime', 'text-darkGreen');

            // ডেটা ফিল্টার করা
            if (status === 'all') {
                renderProjects(allProjectsData);
            } else {
                const filteredData = allProjectsData.filter(project => project.status.toLowerCase() === status);
                renderProjects(filteredData);
            }
        }

        // পেজ লোড হলে প্রথমবার ডেটা কল করা হবে
        document.addEventListener('DOMContentLoaded', fetchAllProjects);

    </script>

    <style>
        /* ফিল্টার করার সময় সুন্দর এনিমেশন দেখানোর জন্য */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body>

</html>
