<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | PropertyNext</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brandLime: '#cbfb00' }
                }
            }
        }
    </script>
</head>

<body
    class="font-sans antialiased bg-[#051c14] text-white flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- Background Glow Effects -->
    <div
        class="absolute top-[-15%] left-[-10%] w-[30rem] h-[30rem] bg-brandLime/10 rounded-full blur-[100px] pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-15%] right-[-10%] w-[30rem] h-[30rem] bg-brandLime/10 rounded-full blur-[100px] pointer-events-none">
    </div>

    <div class="text-center z-10 px-6 max-w-2xl mx-auto w-full">

        <!-- Logo -->
        <a href="index.html" class="inline-block mb-12 transform hover:scale-105 transition-transform duration-300">
            <img src="assets/images/logo.png" alt="PropertyNext Logo" class="w-48 mx-auto">
        </a>

        <!-- Construction Icon -->
        <div
            class="w-24 h-24 bg-white/5 border border-white/10 rounded-full flex items-center justify-center mx-auto mb-8 shadow-[0_0_30px_rgba(203,251,0,0.15)] relative">
            <div class="absolute inset-0 border border-brandLime/30 rounded-full animate-ping opacity-20"></div>
            <i class="fas fa-tools text-brandLime text-4xl"></i>
        </div>

        <!-- Content -->
        <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-5">Page Under Construction</h1>
        <p class="text-gray-400 text-lg leading-relaxed mb-10 max-w-lg mx-auto">
            We are currently working hard to bring this page to life. Stay tuned! It will be worth the wait.
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="index.html"
                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-brandLime text-[#051c14] hover:bg-lime-300 font-bold px-8 py-3.5 rounded-full transition-all shadow-lg hover:shadow-brandLime/20">
                <i class="fas fa-arrow-left"></i> Go Back Home
            </a>
            <a href="contact.html"
                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-white/5 text-white border border-white/10 hover:bg-white/10 font-medium px-8 py-3.5 rounded-full transition-all">
                Contact Support
            </a>
        </div>

    </div>
</body>

</html>
