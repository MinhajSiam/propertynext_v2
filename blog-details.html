<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Article... | PropertyNext</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brandLime: '#cbfb00', darkGreen: '#051c14' }
                }
            }
        }
    </script>
</head>

<body class="font-sans antialiased text-gray-900 bg-[#f8f9fa] overflow-x-hidden flex flex-col min-h-screen">

    <nav class="absolute top-0 left-0 w-full px-6 py-6 z-50 flex justify-between items-center">
        <div
            class="flex items-center bg-white/10 backdrop-blur-md border border-white/20 rounded-full px-6 py-3 shadow-lg">
            <a href="index.html" class="text-xl font-bold tracking-tight text-white mr-8">
                <img src="assets/images/logo.png" alt="PropertyNext Logo" width="220px" class="mr-8">
            </a>
            <ul class="hidden lg:flex items-center gap-6 text-sm font-medium text-gray-200">
                <li><a href="index.html" class="hover:text-brandLime transition-colors">Home</a></li>
                <li><a href="projects.html" class="hover:text-brandLime transition-colors">Projects</a></li>
                <li><a href="blog.html" class="text-brandLime transition-colors">Blog</a></li>
                <li><a href="team.html" class="hover:text-brandLime transition-colors">Team</a></li>
                <li><a href="about.html" class="hover:text-brandLime transition-colors">About</a></li>
                <li><a href="contact.html" class="hover:text-brandLime transition-colors">Contact</a></li>
            </ul>
        </div>
        <div class="hidden md:flex items-center gap-4">
            <a href="tel:+8801632344228"
                class="flex items-center gap-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-full px-5 py-3 shadow-lg text-white font-semibold text-sm">
                <div class="bg-brandLime text-black rounded-full p-1.5"><i class="fas fa-phone-alt text-[10px]"></i>
                </div> +8801632-344228
            </a>
        </div>
    </nav>

    <header class="pt-40 pb-32 bg-darkGreen text-white border-t border-white/10 rounded-b-[3rem] shadow-xl">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <div id="blog-category"
                class="inline-block bg-white/10 text-brandLime text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-wider mb-6 animate-pulse">
                Loading...</div>
            <h1 id="blog-title" class="text-3xl md:text-5xl font-bold leading-tight mb-6">Loading Title...</h1>
            <div class="flex items-center justify-center gap-4 text-sm text-gray-400 font-medium">
                <span><i class="far fa-calendar-alt text-brandLime mr-1"></i> <span id="blog-date">--</span></span>
                <span>•</span>
                <span><i class="far fa-clock text-brandLime mr-1"></i> <span id="blog-read-time">--</span> Min
                    Read</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 -mt-20 relative z-10 pb-20 flex-grow">
        <div class="bg-white rounded-[2rem] p-4 md:p-8 shadow-2xl border border-gray-100">
            <div class="w-full h-[300px] md:h-[450px] rounded-[1.5rem] overflow-hidden mb-8 bg-gray-100">
                <img id="blog-image" src="" alt="Cover" class="w-full h-full object-cover hidden">
            </div>
            <article id="blog-content" class="prose prose-lg max-w-none text-gray-600 leading-loose">
                <div class="flex justify-center py-10"><i class="fas fa-spinner fa-spin text-3xl text-brandLime"></i>
                </div>
            </article>
        </div>
    </main>

    <footer class="bg-darkGreen text-gray-400 py-6 text-center text-sm border-t border-gray-800 mt-auto">
        <p>© 2026 PropertyNext Ltd. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');
            if (!blogId) {
                document.getElementById('blog-title').innerText = "Article Not Found";
                document.getElementById('blog-content').innerHTML = "<p class='text-center'>Please return to the blog page and select a valid article.</p>";
                return;
            }

            try {
                const response = await fetch(`https://propertynextv2-backend.onrender.com/api/blogs/${blogId}`);
                const result = await response.json();

                if (result.success) {
                    const blog = result.data;
                    const blogDate = new Date(blog.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    const readTime = Math.max(1, Math.ceil(blog.content.split(' ').length / 200));

                    // Populate UI
                    document.title = `${blog.title} | PropertyNext`;
                    document.getElementById('blog-title').innerText = blog.title;
                    document.getElementById('blog-category').innerText = blog.category;
                    document.getElementById('blog-date').innerText = blogDate;
                    document.getElementById('blog-read-time').innerText = readTime;

                    const imgEl = document.getElementById('blog-image');
                    imgEl.src = blog.mainImage;
                    imgEl.classList.remove('hidden');

                    // Convert line breaks (\n) to HTML paragraphs (<p>)
                    const formattedContent = blog.content.split('\n')
                        .filter(para => para.trim() !== '') // Remove empty lines
                        .map(para => `<p class="mb-5 text-[17px] text-gray-700 text-justify">${para}</p>`)
                        .join('');

                    document.getElementById('blog-content').innerHTML = formattedContent;
                }
            } catch (error) {
                console.error("Error loading blog details:", error);
                document.getElementById('blog-content').innerHTML = "<p class='text-center text-red-500'>Failed to load article content.</p>";
            }
        });
    </script>
</body>

</html>
